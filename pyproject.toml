[project]
name = "krun-one"
version = "0.1.0"
description = "KRUN-005 - Krun One v0: Laya checkpoint fine-tuned on Krun decision data (experimental)."
requires-python = ">=3.10"
dependencies = [
    "krunbench",
    "encoder-bakeoff",
    "torch==2.14.0",
    "transformers==5.17.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "safetensors>=0.4",
    "huggingface_hub>=0.24",
    "pyarrow>=15",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
krunbench = { path = "../../benchmarks/krunbench", editable = true }
encoder-bakeoff = { path = "../encoder_bakeoff", editable = true }
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krun_one"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
