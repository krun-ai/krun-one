selection_result: {mode: random, why: "tie on score (48.1 vs 47.3) and on stuck rate (65.4 vs 63.5) -> the simpler recipe", candidate_seed: r3r_s1}
outcome: "no candidate: KrunTechBench preserved (62.2), 19/19 text gates, latency unchanged; unseen combinations / flips / stuck unchanged; JevBench not significant; multimodal 2/5 after the 3-epoch fallback. Cases C + D (+ B for multimodal)."
deviations:
  - "post-registration diagnostics (not candidates, no gate uses them): diag_cap_l4, diag_cap_full (capability-only, 3,000 steps, last 4 vs all 22 blocks) and diag_cap_full_b (the all-blocks run repeated and evaluated on JevBench / val_fit)."
  - "multimodal: second fusion seed not run (registered 'if the first passes'); the 1-epoch run failed its gates, so the registered 3-epoch fallback ran instead. No checkpoint was eligible on val_fit; the least-regressing one was taken, as registered."
  - "multimodal dump wrapper fixed after a first failed dump (comparison system built without gates); same checkpoint re-dumped."
  - "speech synthesis shared the GPU with text training and skipped clips; re-run one shard at a time; the media check (0 missing of 74,956 records) passed before any multimodal step."
  - "mixture: capability 9.7% answerable-only (10.7% with its none-of-the-above items), technical + hard negatives 40.3% (band 30-35%)."
  - "latency gate applied one-sided (not slower): seed 1 measured 1.08 ms faster than the same-host v1 on a noisy host."
  - "the R2 reference on the new files is one seed (r2l4na_s1), the only R2 weights kept."
