  pod_a: "krun-v11-r3-a 5jpjn77fxor5bh, RTX 4090 Secure EU-RO-1, 22:28-03:19 UTC = 4.85 h, ~US$ 3.7"
  pod_b: "krun-v11-r3-b a8ncqfeuq3luu5, RTX 4090 Secure EUR-NO-1, 22:40-03:41 UTC = 5.0 h, ~US$ 3.8"
  total: "9.9 GPU-hours, ~US$ 7.5 (estimate 8.5-10 GPU-hours, US$ 6.5-7.5; upper bound US$ 12); both pods terminated, list-pods empty"
  split_approx: {text_training: "3.7 h", evaluation: "1.1 h", multimodal: "2.7 h incl. the fallback", diagnostics: "2.0 h (not in the estimate)", setup: "0.4 h"}
  ollama_cloud_credits_usd: "< 1 (539 reviewed items)"
