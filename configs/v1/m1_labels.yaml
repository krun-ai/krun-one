instructions:  # [en, pt, es, fr]
  image_main: ["Which object is the main subject of the image?", "Qual objeto é o assunto principal da imagem?", "¿Qué objeto es el tema principal de la imagen?", "Quel objet est le sujet principal de l'image ?"]
  image_multi: ["Select every object that appears in the image.", "Selecione todos os objetos que aparecem na imagem.", "Selecciona todos los objetos que aparecen en la imagen.", "Sélectionnez tous les objets présents dans l'image."]
  image_contains: ["The image contains this object: {x}.", "A imagem contém {x}.", "La imagen contiene {x}.", "L'image contient {x}."]
  image_people: ["How many people are in the image?", "Quantas pessoas há na imagem?", "¿Cuántas personas hay en la imagen?", "Combien de personnes y a-t-il dans l'image ?"]
  image_caption: ["Which description matches the image?", "Qual descrição corresponde à imagem?", "¿Qué descripción corresponde a la imagen?", "Quelle description correspond à l'image ?"]
  doc_type: ["What type of document is this?", "Que tipo de documento é este?", "¿Qué tipo de documento es este?", "De quel type de document s'agit-il ?"]
  doc_fields: ["Select every element present in the document.", "Selecione todos os elementos presentes no documento.", "Selecciona todos los elementos presentes en el documento.", "Sélectionnez tous les éléments présents dans le document."]
  doc_paid: ["The document is marked as paid.", "O documento está marcado como pago.", "El documento está marcado como pagado.", "Le document est marqué comme payé."]
  doc_total_gt: ["The total amount is greater than {x}.", "O valor total é maior que {x}.", "El importe total es mayor que {x}.", "Le montant total est supérieur à {x}."]
  doc_signed: ["The document is signed.", "O documento está assinado.", "El documento está firmado.", "Le document est signé."]
  doc_amount: ["How large is the total amount?", "Qual o tamanho do valor total?", "¿Qué tan grande es el importe total?", "Quelle est l'importance du montant total ?"]
  doc_category: ["What kind of document is this page from?", "De que tipo de documento é esta página?", "¿De qué tipo de documento es esta página?", "De quel type de document provient cette page ?"]
  doc_layout: ["Select every layout element on the page.", "Selecione todos os elementos de layout da página.", "Selecciona todos los elementos de diseño de la página.", "Sélectionnez tous les éléments de mise en page."]
  audio_intent: ["What does the caller want?", "O que a pessoa que liga quer?", "¿Qué quiere la persona que llama?", "Que veut l'appelant ?"]
  audio_is: ["The caller is asking about {x}.", "A pessoa está perguntando sobre {x}.", "La persona pregunta sobre {x}.", "L'appelant demande : {x}."]
